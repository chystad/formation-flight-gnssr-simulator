# These configuration options are currently in configs/default.yaml
BASILISK_SIMULATION:
  deltaT:                     1.0 # Solver time step [seconds]
  integrator:                 "RKF78" # [RK4(Default), RKF45, RKF78]

  sphericalHarmonicsDegree:   4 # int >= 2

  useSphericalHarmonics:      true

  useMsisDrag:                false # First priority
  useExponentialDensityDrag:  true # Second priority

  useSRP:                     true

  useSun3rdBody:              true 
  useMoon3rdBody:             true

  override_skf_initial_state: false